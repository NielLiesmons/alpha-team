<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#090909" />
		<meta name="color-scheme" content="dark light" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Alpha" />
		<meta name="application-name" content="Alpha" />
		<meta name="format-detection" content="telephone=no" />
		<meta name="apple-touch-fullscreen" content="yes" />
		<link rel="apple-touch-icon" href="/icons/icon-180.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
		<style>
			/* First paint before CSS/JS modules — theme bg only, no product-name chrome. */
			html,
			body {
				margin: 0;
				min-height: 100%;
				background: #090909;
				color: #eee;
			}
			#alpha-boot-shell {
				position: fixed;
				inset: 0;
				z-index: 99998;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				box-sizing: border-box;
				background: #090909;
				color: #eee;
				font: 500 15px/1.45 system-ui, -apple-system, sans-serif;
				text-align: center;
			}
			#alpha-boot-shell[hidden] {
				display: none !important;
			}
			#alpha-boot-shell .boot-copy {
				max-width: 320px;
			}
			#alpha-boot-shell .boot-title {
				margin: 0 0 10px;
				font-size: 18px;
				font-weight: 650;
			}
			#alpha-boot-shell .boot-body {
				margin: 0;
				color: #aaa;
			}
			#alpha-boot-shell .boot-actions {
				margin-top: 16px;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 10px;
			}
			#alpha-boot-shell button {
				height: 44px;
				padding: 0 18px;
				border: 0;
				border-radius: 14px;
				background: #eee;
				color: #111;
				font: 650 14px system-ui, -apple-system, sans-serif;
				cursor: pointer;
			}
			#alpha-boot-shell button:disabled {
				opacity: 0.55;
				cursor: wait;
			}
			#alpha-boot-shell .boot-link {
				font-size: 13px;
				color: #888;
			}
			#alpha-boot-shell .boot-link a {
				color: #ccc;
			}
			/* Quiet three-ball wave (matches MetaballLoader) — no branded copy. */
			#alpha-boot-shell .boot-loader {
				display: inline-flex;
				align-items: center;
				justify-content: space-between;
				width: 42px;
				height: 24px;
				padding-top: 2px;
				box-sizing: border-box;
				color: #666;
			}
			#alpha-boot-shell .boot-ball {
				display: block;
				flex: 0 0 auto;
				width: 24%;
				aspect-ratio: 1;
				border-radius: 50%;
				background: currentColor;
				animation: alpha-boot-wave 1.05s ease-in-out infinite;
			}
			#alpha-boot-shell .boot-ball:nth-child(2) {
				animation-delay: 0.14s;
			}
			#alpha-boot-shell .boot-ball:nth-child(3) {
				animation-delay: 0.28s;
			}
			@keyframes alpha-boot-wave {
				0%,
				100% {
					transform: translateY(0);
					opacity: 0.55;
				}
				50% {
					transform: translateY(-35%);
					opacity: 1;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#alpha-boot-shell .boot-ball {
					animation: alpha-boot-pulse 1.4s ease-in-out infinite;
				}
				#alpha-boot-shell .boot-ball:nth-child(2) {
					animation-delay: 0.2s;
				}
				#alpha-boot-shell .boot-ball:nth-child(3) {
					animation-delay: 0.4s;
				}
				@keyframes alpha-boot-pulse {
					0%,
					100% {
						opacity: 0.4;
						transform: scale(0.92);
					}
					50% {
						opacity: 1;
						transform: scale(1);
					}
				}
			}
		</style>
		<script>
			/* Inline recovery — must run before any module load (poisoned SW / missing chunks). */
			(function () {
				try {
					var params = new URLSearchParams(location.search);
					var wantRecover = params.has('recover') || params.has('reset');
					if (!wantRecover) return;

					var full = params.has('reset');
					window.__ALPHA_RECOVERING = true;

					document.documentElement.style.background = '#090909';
					document.documentElement.style.color = '#eee';
					var paint = function () {
						var shell = document.getElementById('alpha-boot-shell');
						if (shell) {
							shell.hidden = false;
							shell.innerHTML =
								'<div class="boot-copy">' +
								'<p class="boot-title">Resetting…</p>' +
								'<p class="boot-body">Clearing cached shell, then reloading.</p>' +
								'</div>';
							return;
						}
						if (!document.body) return;
						document.body.innerHTML =
							'<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#090909;color:#eee;font:500 15px/1.45 system-ui,-apple-system,sans-serif;text-align:center">' +
							'<div style="max-width:320px">' +
							'<p style="margin:0 0 10px;font-size:18px;font-weight:650">Resetting…</p>' +
							'<p style="margin:0;color:#aaa">Clearing cached shell, then reloading.</p>' +
							'</div></div>';
					};
					if (document.body) paint();
					else document.addEventListener('DOMContentLoaded', paint, { once: true });

					var done = false;
					var goClean = function () {
						if (done) return;
						done = true;
						var url = new URL(location.href);
						url.searchParams.delete('recover');
						url.searchParams.delete('reset');
						url.searchParams.set('_r', String(Date.now()));
						location.replace(url.pathname + url.search + url.hash);
					};

					var withTimeout = function (promise, ms) {
						return Promise.race([
							Promise.resolve(promise).catch(function () {}),
							new Promise(function (resolve) {
								setTimeout(resolve, ms);
							})
						]);
					};

					var clearAndGo = async function () {
						await withTimeout(
							(async function () {
								if (typeof caches === 'undefined') return;
								var keys = await caches.keys();
								await Promise.all(
									keys.map(function (k) {
										return caches.delete(k);
									})
								);
							})(),
							2500
						);
						await withTimeout(
							(async function () {
								if (!('serviceWorker' in navigator)) return;
								var regs = await navigator.serviceWorker.getRegistrations();
								await Promise.all(
									regs.map(function (r) {
										return r.unregister();
									})
								);
							})(),
							2500
						);
						if (full) {
							try {
								var keep = { 'alpha-admin-theme': 1, 'alpha-admin-theme.v1': 1 };
								var doomed = [];
								for (var i = 0; i < localStorage.length; i++) {
									var k = localStorage.key(i);
									if (!k || keep[k]) continue;
									if (k.indexOf('alpha') === 0) doomed.push(k);
								}
								for (var j = 0; j < doomed.length; j++) localStorage.removeItem(doomed[j]);
							} catch (e) {}
						}
						try {
							sessionStorage.setItem('alpha.boot.recover.v1', String(Date.now()));
						} catch (e) {}
						goClean();
					};

					/* Hard deadline — iOS can hang on caches.delete / unregister. */
					setTimeout(goClean, 6000);
					clearAndGo().catch(goClean);
				} catch (e) {
					try {
						location.replace('/api/recover');
					} catch (e2) {}
				}
			})();
		</script>
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('alpha-admin-theme') || 'system';
					var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var theme =
						saved === 'light' || saved === 'dark'
							? saved
							: saved === 'gray' || saved === 'black'
								? 'dark'
								: dark
									? 'dark'
									: 'light';
					document.documentElement.dataset.theme = theme;
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) {
						meta.setAttribute('content', theme === 'light' ? '#f6f6f6' : '#090909');
					}
					/* Light theme shell is gray — match first paint so it doesn’t flash black. */
					if (theme === 'light') {
						document.documentElement.style.background = '#e2e2e2';
						document.documentElement.style.color = '#111';
						document.addEventListener(
							'DOMContentLoaded',
							function () {
								var shell = document.getElementById('alpha-boot-shell');
								if (!shell || shell.getAttribute('role') === 'alert') return;
								shell.style.background = '#e2e2e2';
								shell.style.color = '#111';
								var loader = shell.querySelector('.boot-loader');
								if (loader) loader.style.color = '#999';
								var body = shell.querySelector('.boot-body');
								if (body) body.style.color = '#666';
							},
							{ once: true }
						);
					}
				} catch (e) {}
			})();
		</script>
		<script>
			/* Text size — apply --ui-scale before CSS rem-root paints (matches ui-scale.svelte.js). */
			(function () {
				try {
					var factors = { small: 0.95, normal: 1.07, large: 1.18 };
					var saved = localStorage.getItem('alpha-admin-ui-scale');
					var choice =
						saved === 'small' || saved === 'normal' || saved === 'large' ? saved : null;
					if (!choice) {
						var w = Math.min(window.innerWidth || 0, (screen && screen.width) || 0);
						var mobile =
							window.matchMedia('(max-width: 767px)').matches ||
							window.matchMedia('(pointer: coarse)').matches;
						choice = mobile && w > 0 && w <= 375 ? 'small' : 'normal';
					}
					var factor = factors[choice] || 1.07;
					document.documentElement.style.setProperty('--ui-scale', String(factor));
					document.documentElement.dataset.uiScale = choice;
				} catch (e) {}
			})();
		</script>
		<script>
			/*
			 * Boot watchdog: keep a minimal shell from first paint, then auto-recover
			 * when hashed chunks 404 under a stale service worker (post-deploy blank PWA).
			 */
			(function () {
				if (window.__ALPHA_RECOVERING) return;

				var AUTO_KEY = 'alpha.boot.auto-recover.v1';
				var started = false;
				var escalated = false;

				var hideShell = function () {
					var el = document.getElementById('alpha-boot-shell');
					if (el) el.hidden = true;
				};

				var markStarted = function () {
					if (started) return;
					started = true;
					hideShell();
					try {
						sessionStorage.removeItem(AUTO_KEY);
					} catch (e) {}
				};

				window.addEventListener('alpha-boot-started', markStarted, { once: true });

				var goRecover = function () {
					try {
						location.replace('/api/recover');
					} catch (e) {
						location.href = '/api/recover';
					}
				};

				var paintTrouble = function (auto) {
					var shell = document.getElementById('alpha-boot-shell');
					if (!shell) return;
					shell.hidden = false;
					shell.setAttribute('role', 'alert');
					shell.innerHTML =
						'<div class="boot-copy">' +
						'<p class="boot-title">Couldn’t start</p>' +
						'<p class="boot-body">' +
						(auto
							? 'Clearing the cached shell automatically…'
							: 'Cached shell looks stuck. Clear it and reload.') +
						'</p>' +
						'<div class="boot-actions">' +
						'<button type="button" id="alpha-boot-reload">Reload app</button>' +
						'<p class="boot-link">Or open <a href="/api/recover">team.bley.farm/api/recover</a></p>' +
						'</div></div>';
					var btn = document.getElementById('alpha-boot-reload');
					if (btn) {
						btn.onclick = function () {
							btn.disabled = true;
							btn.textContent = 'Clearing…';
							goRecover();
						};
					}
				};

				var autoRecoverOnce = function (reason) {
					if (started || window.__ALPHA_RECOVERING || escalated) return;
					escalated = true;
					var already = false;
					try {
						already = sessionStorage.getItem(AUTO_KEY) === '1';
					} catch (e) {}
					if (already) {
						paintTrouble(false);
						return;
					}
					try {
						sessionStorage.setItem(AUTO_KEY, '1');
					} catch (e) {}
					paintTrouble(true);
					/* Give the UI a tick to paint, then bypass the SW via /api/recover. */
					setTimeout(goRecover, 180);
					try {
						console.warn('alpha boot auto-recover', reason || '');
					} catch (e) {}
				};

				var looksLikeChunkFailure = function (msg) {
					return /Failed to fetch|Loading chunk|dynamically imported module|Importing a module script failed|error loading dynamically|404|MIME type|module script/i.test(
						String(msg || '')
					);
				};

				window.addEventListener('unhandledrejection', function (e) {
					var reason = e && e.reason;
					var msg =
						reason && (reason.message || reason.name)
							? String(reason.message || reason.name)
							: String(reason || '');
					if (looksLikeChunkFailure(msg)) autoRecoverOnce(msg);
				});

				window.addEventListener(
					'error',
					function (e) {
						var msg = (e && (e.message || (e.error && e.error.message))) || '';
						var src = (e && e.filename) || '';
						if (looksLikeChunkFailure(msg) || /\/_app\/immutable\//.test(src)) {
							autoRecoverOnce(msg || src);
						}
					},
					true
				);

				var watchHydration = function () {
					/* Hide the pre-module shell as soon as Svelte paints BootSplash / shell. */
					if (document.querySelector('.shell, .welcome, .splash')) {
						markStarted();
						return;
					}
					var obs = new MutationObserver(function () {
						if (started || window.__ALPHA_RECOVERING) {
							obs.disconnect();
							return;
						}
						if (document.querySelector('.shell, .welcome, .splash')) {
							obs.disconnect();
							markStarted();
						}
					});
					try {
						obs.observe(document.documentElement, { childList: true, subtree: true });
					} catch (e) {}
					/* If Svelte never mounts, don’t wait on a blank shell. */
					setTimeout(function () {
						obs.disconnect();
						if (started || window.__ALPHA_RECOVERING) return;
						if (document.querySelector('.shell, .welcome, .splash')) {
							markStarted();
							return;
						}
						autoRecoverOnce('hydration-timeout');
					}, 2800);
				};

				if (document.readyState === 'loading') {
					document.addEventListener('DOMContentLoaded', watchHydration, { once: true });
				} else {
					watchHydration();
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="alpha-boot-shell" aria-live="polite" aria-busy="true" aria-label="Loading">
			<div class="boot-loader" aria-hidden="true">
				<span class="boot-ball"></span>
				<span class="boot-ball"></span>
				<span class="boot-ball"></span>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
